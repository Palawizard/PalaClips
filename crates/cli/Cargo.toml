[package]
name = "palaclips-cli"
description = "Banc de test du moteur PalaClips, sans UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "palaclips-cli"
path = "src/main.rs"

[dependencies]
palaclips-engine.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm"] }
windows-capture.workspace = true
wasapi.workspace = true

[lints]
workspace = true
