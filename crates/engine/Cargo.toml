[package]
name = "palaclips-engine"
description = "Moteur de capture, d'encodage et de replay de PalaClips (sans UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
notify.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
rsmpeg = "0.18"
windows = { workspace = true, features = ["Wdk_Graphics_Direct3D", "Wdk_System_Threading", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Time", "Win32_NetworkManagement_NetManagement", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Foundation"] }
windows-capture.workspace = true
wasapi.workspace = true
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

