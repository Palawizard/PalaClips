[package]
name = "palaclips-app"
description = "PalaClips — enregistrement et replay instantané pour Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "palaclips_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
palaclips-engine.workspace = true
tauri = { version = "2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Plugins prévus (versions stables vérifiées le 2026-10-15) — ajoutés en phase 5/8 :
# tauri-plugin-global-shortcut = "2.4"
# tauri-plugin-single-instance = "2.5"
