[package]
name = "palaclips-app"
description = "PalaClips — enregistrement et replay instantané pour Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "palaclips_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
palaclips-engine.workspace = true
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Globalization", "Win32_Media_Audio"] }

[lints]
workspace = true
