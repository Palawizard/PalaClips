[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/cli",
    "app/src-tauri",
]
default-members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Palawi"]
repository = "https://github.com/Palawizard/PalaClips"

[workspace.dependencies]
# Socle commun (versions vérifiées le 2026-10-15)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
clap = { version = "4.6", features = ["derive"] }

# Interne
palaclips-engine = { path = "crates/engine" }

# Windows uniquement — à ajouter dans les crates au fil des phases (voir docs/PLAN.md)
# windows-capture = "2.0"
# wasapi = "0.26"
# windows = "0.62"
# sysinfo = "0.39"
# rsmpeg = "0.18"   # FFmpeg 8.x, voir docs/DECISIONS.md ADR-004

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
